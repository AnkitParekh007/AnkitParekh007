<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="685" viewBox="0 0 1100 685" role="img" aria-labelledby="title desc">
<title id="title">How I think about enterprise AI architecture</title><desc id="desc">Five linked layers: experience, contracts, backend governance, intelligent execution, and observability, with permissions and safety controlling AI tools.</desc>
<defs><linearGradient id="back" x2="1" y2="1"><stop stop-color="#0B122A"/><stop offset="1" stop-color="#0D2440"/></linearGradient><linearGradient id="strip" x2="1"><stop stop-color="#8B5CF6"/><stop offset="1" stop-color="#06B6D4"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#67E8F9"/></marker></defs>
<rect width="1100" height="685" rx="22" fill="url(#back)"/><text x="550" y="46" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-size="27" font-weight="750" fill="#F8FAFC">Enterprise AI systems: trust by design</text><text x="550" y="73" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="15" fill="#CBD5E1">Separation of responsibilities • Human oversight • Observable outcomes</text>
<g font-family="Arial,Helvetica,sans-serif">
<rect x="100" y="99" width="900" height="87" rx="15" fill="#202653" stroke="#A78BFA" stroke-width="2"/><rect x="100" y="99" width="8" height="87" rx="4" fill="#A78BFA"/><text x="135" y="131" font-size="20" font-weight="700" fill="#F5F3FF">01  Experience layer</text><text x="135" y="158" font-size="16" fill="#DDD6FE">Angular / TypeScript • Streaming UX • Grounded citations • Tool timeline • Approval UX</text>
<path d="M550 186V220" stroke="#67E8F9" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="100" y="225" width="900" height="79" rx="15" fill="#163854" stroke="#38BDF8" stroke-width="2"/><rect x="100" y="225" width="8" height="79" rx="4" fill="#38BDF8"/><text x="135" y="257" font-size="20" font-weight="700" fill="#F0F9FF">02  Typed application contracts</text><text x="135" y="282" font-size="16" fill="#BAE6FD">API / SDK boundaries • Authenticated requests • Event schema • Explicit errors</text>
<path d="M550 304V338" stroke="#67E8F9" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="100" y="343" width="900" height="92" rx="15" fill="#15454A" stroke="#2DD4BF" stroke-width="2"/><rect x="100" y="343" width="8" height="92" rx="4" fill="#2DD4BF"/><text x="135" y="378" font-size="20" font-weight="700" fill="#F0FDFA">03  Backend governance &amp; orchestration</text><text x="135" y="404" font-size="16" fill="#CCFBF1">Authorization • RBAC • Policy • Approval gates • Budget controls • Audit trail</text><text x="826" y="378" text-anchor="end" font-size="14" font-weight="700" fill="#5EEAD4">AUTHORITY LIVES HERE</text>
<path d="M550 435V469" stroke="#67E8F9" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="100" y="474" width="900" height="85" rx="15" fill="#322354" stroke="#C084FC" stroke-width="2"/><rect x="100" y="474" width="8" height="85" rx="4" fill="#C084FC"/><text x="135" y="507" font-size="20" font-weight="700" fill="#FAF5FF">04  Intelligent execution &amp; integrations</text><text x="135" y="532" font-size="16" fill="#E9D5FF">LLMs • RAG &amp; provenance • MCP tools • Isolated agents • Enterprise connectors</text>
<path d="M550 559V590" stroke="#67E8F9" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="100" y="595" width="900" height="65" rx="15" fill="#18334B" stroke="#67E8F9" stroke-width="2"/><rect x="100" y="595" width="8" height="65" rx="4" fill="#67E8F9"/><text x="135" y="622" font-size="20" font-weight="700" fill="#F0F9FF">05  Outcome verification &amp; recovery</text><text x="135" y="645" font-size="16" fill="#BAE6FD">Traces • Evidence • Retries • Idempotency • Reconciliation • Safe rollback</text>
</g></svg>