name: Profile README quality checks
on:
  pull_request:
    paths:
      - 'README.md'
      - 'assets/**'
      - 'scripts/check_profile.py'
      - '.github/workflows/profile-check.yml'
  push:
    branches: [main]
    paths:
      - 'README.md'
      - 'assets/**'
      - 'scripts/check_profile.py'
      - '.github/workflows/profile-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate profile assets, links and hierarchy
        run: python scripts/check_profile.py
